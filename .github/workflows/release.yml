name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Runs the exact same checks as CI (gofmt, build, vet, race tests, web lint +
  # build). A tag can never be published with a broken tree.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Kept in sync with the `go` directive in go.mod (1.25.0).
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # MUST run before the server build: this produces web/dist and copies it
      # to internal/api/static/dist, which cmd/server pulls in via go:embed.
      - name: Build UI
        run: make build-ui-ci

      - name: Build server (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.version=${{ github.ref_name }}" \
            -o bin/nat-backup-server-linux-amd64 \
            ./cmd/server

      # scripts/install.sh resolves the server asset as
      # nat-backup-server-linux-$ARCH with ARCH in {amd64, arm64}.
      - name: Build server (linux/arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build \
            -ldflags "-X main.version=${{ github.ref_name }}" \
            -o bin/nat-backup-server-linux-arm64 \
            ./cmd/server

      # Agent asset names must match scripts/install.sh
      # (nat-backup-agent-linux-$ARCH), scripts/install-agent.ps1
      # (nat-backup-agent-windows-amd64.exe) and cmd/agent/update.go
      # (nat-backup-agent-$GOOS-$GOARCH[.exe]).
      - name: Build agent (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.version=${{ github.ref_name }}" \
            -o bin/nat-backup-agent-linux-amd64 \
            ./cmd/agent

      - name: Build agent (linux/arm64)
        run: |
          GOOS=linux GOARCH=arm64 go build \
            -ldflags "-X main.version=${{ github.ref_name }}" \
            -o bin/nat-backup-agent-linux-arm64 \
            ./cmd/agent

      - name: Build agent (windows/amd64)
        run: |
          GOOS=windows GOARCH=amd64 go build \
            -ldflags "-X main.version=${{ github.ref_name }}" \
            -o bin/nat-backup-agent-windows-amd64.exe \
            ./cmd/agent

      - name: Generate checksums
        run: |
          cd bin
          sha256sum nat-backup-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/nat-backup-server-linux-amd64
            bin/nat-backup-server-linux-arm64
            bin/nat-backup-agent-linux-amd64
            bin/nat-backup-agent-linux-arm64
            bin/nat-backup-agent-windows-amd64.exe
            bin/SHA256SUMS
            scripts/install.sh
            scripts/install-agent.ps1
